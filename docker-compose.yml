services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowproof
      POSTGRES_PASSWORD: flowproof
      POSTGRES_DB: flowproof
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flowproof_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowproof -d flowproof"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  flowproof_pg:
